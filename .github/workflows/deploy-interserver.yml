name: Deploy to InterServer

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 69.169.97.136
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend/,backend/"
          target: "/var/www/tala.mkopaji.com"
          strip_components: 0

      - name: Restart backend and configure Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 69.169.97.136
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            APP_ROOT="/var/www/tala.mkopaji.com"
            BACKEND_DIR="$APP_ROOT/backend"
            FRONTEND_DIR="$APP_ROOT/frontend"
            WEB_ROOT="$APP_ROOT/frontend/build"

            cd "$BACKEND_DIR"
            npm install --omit=dev

            cd "$FRONTEND_DIR"
            npm install
            npm run build

            if pm2 list | grep -q "tala-backend"; then
              pm2 reload tala-backend --update-env
            else
              pm2 start src/server.js --name tala-backend
              pm2 save
            fi

            if [ "$(id -u)" -eq 0 ]; then
              SUDO=''
            else
              SUDO='sudo'
            fi

            if command -v apt-get >/dev/null 2>&1; then
              $SUDO apt-get update
              $SUDO apt-get install -y nginx certbot
            elif command -v dnf >/dev/null 2>&1; then
              $SUDO dnf install -y nginx certbot
            elif command -v yum >/dev/null 2>&1; then
              $SUDO yum install -y nginx certbot
            fi

            cat <<'EOF' | $SUDO tee /etc/nginx/conf.d/tala.mkopaji.com.conf > /dev/null
            server {
              listen 80;
              listen [::]:80;
              server_name tala.mkopaji.com;

              root /var/www/tala.mkopaji.com/frontend/build;

              location /.well-known/acme-challenge/ {
                allow all;
              }

              location / {
                try_files $uri $uri/ /index.html;
              }
            }
            EOF

            $SUDO nginx -t
            $SUDO systemctl enable nginx
            $SUDO systemctl restart nginx

            if [ ! -f /etc/letsencrypt/live/tala.mkopaji.com/fullchain.pem ]; then
              $SUDO certbot certonly \
                --webroot \
                -w "$WEB_ROOT" \
                -d tala.mkopaji.com \
                --non-interactive \
                --agree-tos \
                --register-unsafely-without-email \
                --keep-until-expiring
            fi

            cat <<'EOF' | $SUDO tee /etc/nginx/conf.d/tala.mkopaji.com.conf > /dev/null
            server {
              listen 80;
              listen [::]:80;
              server_name tala.mkopaji.com;

              return 301 https://$host$request_uri;
            }

            server {
              listen 443 ssl http2;
              listen [::]:443 ssl http2;
              server_name tala.mkopaji.com;

              root /var/www/tala.mkopaji.com/frontend/build;
              index index.html;

              ssl_certificate /etc/letsencrypt/live/tala.mkopaji.com/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/tala.mkopaji.com/privkey.pem;

              location /api/ {
                proxy_pass http://127.0.0.1:5000;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
              }

              location / {
                try_files $uri $uri/ /index.html;
              }
            }
            EOF

            $SUDO rm -f /etc/nginx/sites-enabled/mkopaji.conf /etc/nginx/sites-enabled/000-mkopaji.conf /etc/nginx/conf.d/000-mkopaji-priority.conf

            if [ -f /etc/letsencrypt/live/mkopaji.com/fullchain.pem ] && [ -f /etc/letsencrypt/live/mkopaji.com/privkey.pem ]; then
              cat <<'EOF' | $SUDO tee /etc/nginx/conf.d/mkopaji-redirect.conf > /dev/null
              server {
                listen 80;
                listen [::]:80;
                server_name mkopaji.com www.mkopaji.com;

                return 301 https://tala.mkopaji.com$request_uri;
              }

              server {
                listen 443 ssl http2;
                listen [::]:443 ssl http2;
                server_name mkopaji.com www.mkopaji.com;

                ssl_certificate /etc/letsencrypt/live/mkopaji.com/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/mkopaji.com/privkey.pem;

                return 301 https://tala.mkopaji.com$request_uri;
              }
              EOF
            else
              cat <<'EOF' | $SUDO tee /etc/nginx/conf.d/mkopaji-redirect.conf > /dev/null
              server {
                listen 80;
                listen [::]:80;
                server_name mkopaji.com www.mkopaji.com;

                return 301 https://tala.mkopaji.com$request_uri;
              }
              EOF
            fi

            $SUDO nginx -t
            $SUDO systemctl restart nginx

            echo "Deployment complete."
