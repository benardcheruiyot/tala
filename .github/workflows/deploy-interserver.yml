name: Deploy to InterServer

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 69.169.97.136
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend/,backend/"
          target: "/var/www/tala.mkopaji.com"
          strip_components: 0

      - name: Restart backend and configure Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 69.169.97.136
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            APP_ROOT="/var/www/tala.mkopaji.com"
            BACKEND_DIR="$APP_ROOT/backend"
            WEB_ROOT="$APP_ROOT/frontend/build"

            cd "$BACKEND_DIR"
            npm install --omit=dev

            if pm2 list | grep -q "tala-backend"; then
              pm2 reload tala-backend --update-env
            else
              pm2 start src/server.js --name tala-backend
              pm2 save
            fi

            if [ "$(id -u)" -eq 0 ]; then
              SUDO=''
            else
              SUDO='sudo'
            fi

            if command -v apt-get >/dev/null 2>&1; then
              $SUDO apt-get update
              $SUDO apt-get install -y nginx
            elif command -v dnf >/dev/null 2>&1; then
              $SUDO dnf install -y nginx
            elif command -v yum >/dev/null 2>&1; then
              $SUDO yum install -y nginx
            fi

            cat <<'EOF' | $SUDO tee /etc/nginx/conf.d/tala.mkopaji.com.conf > /dev/null
            server {
              listen 80;
              listen [::]:80;
              server_name tala.mkopaji.com mkopaji.com www.mkopaji.com;

              root /var/www/tala.mkopaji.com/frontend/build;
              index index.html;

              location /api/ {
                proxy_pass http://127.0.0.1:5000;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
              }

              location / {
                try_files $uri $uri/ /index.html;
              }
            }
            EOF

            $SUDO nginx -t
            $SUDO systemctl enable nginx
            $SUDO systemctl restart nginx

            echo "Deployment complete."
