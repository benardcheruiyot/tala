name: Deploy to InterServer

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create production .env file
        run: |
          cat > backend/.env.production << 'EOF'
          NODE_ENV=production
          PORT=5000
          FRONTEND_URL=https://tala.mkopaji.com
          FRONTEND_URLS=http://localhost:3000,http://127.0.0.1:3000
          MONGODB_URI=
          JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}
          JWT_EXPIRE=7d
          MPESA_CONSUMER_KEY=${{ secrets.PROD_MPESA_CONSUMER_KEY }}
          MPESA_CONSUMER_SECRET=${{ secrets.PROD_MPESA_CONSUMER_SECRET }}
          MPESA_SHORTCODE=${{ secrets.PROD_MPESA_SHORTCODE }}
          MPESA_PARTYB=${{ secrets.PROD_MPESA_PARTYB }}
          MPESA_PASSKEY=${{ secrets.PROD_MPESA_PASSKEY }}
          MPESA_ENVIRONMENT=production
          MPESA_TRANSACTION_TYPE=CustomerBuyGoodsOnline
          VAPID_PUBLIC_KEY=${{ secrets.PROD_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY=${{ secrets.PROD_VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT=mailto:admin@tala.mkopaji.com
          MPESA_CALLBACK_URL=https://tala.mkopaji.com/api/mpesa/callback
          LOAN_MIN_AMOUNT=1000
          LOAN_MAX_AMOUNT=100000
          LOAN_INTEREST_RATE=0.1
          LOAN_TERMS_DAYS=30,60,90
          PROCESSING_FEE=300
          EOF

      - name: Sync files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 69.169.97.136
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend/,backend/"
          target: "/var/www/tala.mkopaji.com"
          strip_components: 0
          overwrite: true

      - name: Restart backend and configure Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 69.169.97.136
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            APP_ROOT="/var/www/tala.mkopaji.com"
            BACKEND_DIR="$APP_ROOT/backend"
            FRONTEND_DIR="$APP_ROOT/frontend"

            # Setup production environment
            cd "$BACKEND_DIR"
            
            # Verify .env.production exists
            if [ ! -f .env.production ]; then
              echo "❌ ERROR: .env.production not found!"
              exit 1
            fi
            
            # Copy to .env
            cp .env.production .env
            
            # Verify NODE_ENV is set to production
            if grep -q "NODE_ENV=production" .env; then
              echo "✓ NODE_ENV=production verified"
            else
              echo "❌ ERROR: NODE_ENV is not set to production!"
              cat .env
              exit 1
            fi
            
            # Verify JWT_SECRET is not a placeholder
            if grep -q "JWT_SECRET=REPLACE_WITH_PRODUCTION_SECRET" .env; then
              echo "⚠️  WARNING: JWT_SECRET uses placeholder value (secrets not configured)"
            fi
            
            echo "✓ Production environment configured"
            
            npm install --omit=dev

            cd "$FRONTEND_DIR"
            npm install
            npm run build

            cd "$BACKEND_DIR"
            if pm2 list | grep -q "tala-backend"; then
              NODE_ENV=production pm2 reload tala-backend --update-env
            else
              NODE_ENV=production pm2 start src/server.js --name tala-backend
              pm2 save
            fi

            if [ "$(id -u)" -eq 0 ]; then
              SUDO=''
            else
              SUDO='sudo'
            fi

            if command -v apt-get >/dev/null 2>&1; then
              $SUDO apt-get update
              $SUDO apt-get install -y nginx certbot
            elif command -v dnf >/dev/null 2>&1; then
              $SUDO dnf install -y nginx certbot
            elif command -v yum >/dev/null 2>&1; then
              $SUDO yum install -y nginx certbot
            fi

            $SUDO systemctl enable nginx

            if [ ! -f /etc/letsencrypt/live/tala.mkopaji.com/fullchain.pem ]; then
              $SUDO systemctl stop nginx || true
              $SUDO certbot certonly \
                --standalone \
                -d tala.mkopaji.com \
                --non-interactive \
                --agree-tos \
                --register-unsafely-without-email \
                --keep-until-expiring
            fi

            cat <<'EOF' | $SUDO tee /etc/nginx/conf.d/tala.mkopaji.com.conf > /dev/null
            server {
              listen 80;
              listen [::]:80;
              server_name tala.mkopaji.com;

              return 301 https://$host$request_uri;
            }

            server {
              listen 443 ssl http2;
              listen [::]:443 ssl http2;
              server_name tala.mkopaji.com;

              root /var/www/tala.mkopaji.com/frontend/build;
              index index.html;

              ssl_certificate /etc/letsencrypt/live/tala.mkopaji.com/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/tala.mkopaji.com/privkey.pem;

              location /api/ {
                proxy_pass http://127.0.0.1:5000;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
              }

              location / {
                try_files $uri $uri/ /index.html;
              }
            }
            EOF

            $SUDO rm -f /etc/nginx/sites-enabled/mkopaji.conf /etc/nginx/sites-enabled/000-mkopaji.conf /etc/nginx/conf.d/000-mkopaji-priority.conf

            cat <<'EOF' | $SUDO tee /etc/nginx/conf.d/mkopaji-redirect.conf > /dev/null
            server {
              listen 80;
              listen [::]:80;
              server_name mkopaji.com www.mkopaji.com;

              return 301 https://tala.mkopaji.com$request_uri;
            }

            server {
              listen 443 ssl http2;
              listen [::]:443 ssl http2;
              server_name mkopaji.com www.mkopaji.com;

              ssl_certificate /etc/letsencrypt/live/mkopaji.com/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/mkopaji.com/privkey.pem;

              return 301 https://tala.mkopaji.com$request_uri;
            }
            EOF

            $SUDO nginx -t
            $SUDO systemctl restart nginx

            echo "Deployment complete."
