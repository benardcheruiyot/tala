name: Deploy To InterServer

on:
  push:

concurrency:
  group: deploy-interserver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
        run: npm run build

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-source
          path: |
            backend/**
            !backend/node_modules/**
            !backend/.env

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/**

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-source
          path: dist

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist/frontend/build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.INTERSERVER_SSH_KEY }}
          SSH_HOST: ${{ secrets.INTERSERVER_HOST }}
          SSH_PORT: ${{ secrets.INTERSERVER_SSH_PORT }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$SSH_HOST" ]; then
            echo "Missing SSH secrets. Set INTERSERVER_SSH_KEY and INTERSERVER_HOST."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s" "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy files to InterServer
        env:
          SSH_HOST: ${{ secrets.INTERSERVER_HOST }}
          SSH_USER: ${{ secrets.INTERSERVER_USER }}
          SSH_PORT: ${{ secrets.INTERSERVER_SSH_PORT }}
          APP_DIR: ${{ secrets.INTERSERVER_APP_DIR }}
          WEB_ROOT: ${{ secrets.INTERSERVER_WEB_ROOT }}
          BACKEND_ENV_FILE: ${{ secrets.BACKEND_ENV_FILE }}
        run: |
          if [ -z "$SSH_USER" ] || [ -z "$APP_DIR" ] || [ -z "$WEB_ROOT" ] || [ -z "$BACKEND_ENV_FILE" ]; then
            echo "Missing deploy secrets. Set INTERSERVER_USER, INTERSERVER_APP_DIR, INTERSERVER_WEB_ROOT, and BACKEND_ENV_FILE."
            exit 1
          fi

          ssh -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" "
            set -e
            mkdir -p '$APP_DIR/backend' '$WEB_ROOT'
          "

          BACKEND_ENV_B64=$(printf "%s" "$BACKEND_ENV_FILE" | base64 -w0)
          ssh -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" "
            set -e
            echo '$BACKEND_ENV_B64' | base64 -d > '$APP_DIR/backend/.env'
            chmod 600 '$APP_DIR/backend/.env'
          "

          rsync -az --delete -e "ssh -p ${SSH_PORT:-22}" \
            dist/backend/ "$SSH_USER@$SSH_HOST:$APP_DIR/backend/"

          rsync -az --delete -e "ssh -p ${SSH_PORT:-22}" \
            dist/frontend/build/ "$SSH_USER@$SSH_HOST:$WEB_ROOT/"

      - name: Install production dependencies and restart backend
        env:
          SSH_HOST: ${{ secrets.INTERSERVER_HOST }}
          SSH_USER: ${{ secrets.INTERSERVER_USER }}
          SSH_PORT: ${{ secrets.INTERSERVER_SSH_PORT }}
          APP_DIR: ${{ secrets.INTERSERVER_APP_DIR }}
        run: |
          ssh -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" "
            set -e
            cd '$APP_DIR/backend'
            npm install --omit=dev

            if ! command -v pm2 >/dev/null 2>&1; then
              npm install -g pm2
            fi

            if pm2 describe tala-backend >/dev/null 2>&1; then
              pm2 restart tala-backend --update-env
            else
              pm2 start npm --name tala-backend -- start
            fi

            pm2 save
          "
